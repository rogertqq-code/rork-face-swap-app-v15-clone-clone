[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faceswap-qa-agent"
version = "0.1.0"
description = "Persistent macOS USB-device QA runner for FaceSwapLiveAppV17"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Manus AI" }]
dependencies = []

[project.scripts]
faceswap-qa-agent = "faceswap_qa_agent.cli:main"

[tool.setuptools]
packages = ["faceswap_qa_agent"]
