name: CI

on:
  push:
    branches: [main, develop, "manus/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test-js:
    name: Lint and test embedded media runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract exact Swift-embedded JavaScript
        run: python3 scripts/extract_style_scripts.py --output build/generated-js

      - name: Parse extracted runtimes
        run: |
          node --check build/generated-js/patchScript.js
          node --check build/generated-js/nativeWebRTCClientScript.js

      - name: Detect undefined production helpers
        run: npx --yes eslint@8.57.1 -c scripts/.eslintrc.json build/generated-js/patchScript.js build/generated-js/nativeWebRTCClientScript.js

      - name: Run deterministic media regression harness
        run: node scripts/media_regression_harness.mjs build/generated-js

      - name: Check patch whitespace
        run: git diff --check

  build-and-test-ios:
    name: Build and test iOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/FaceSwapLiveAppV17.xcodeproj \
            -scheme FaceSwapLiveAppV17

      - name: Select and boot an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for values in data["devices"].values() for d in values if d.get("isAvailable") and d.get("deviceTypeIdentifier", "").startswith("com.apple.CoreSimulator.SimDeviceType.iPhone")]; print(devices[0]["udid"] if devices else "")')
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator was found." >&2
            exit 1
          fi
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Build and test
        run: |
          set -o pipefail && xcodebuild clean build test \
            -project ios/FaceSwapLiveAppV17.xcodeproj \
            -scheme FaceSwapLiveAppV17 \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/FaceSwapLiveAppV17.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=6.0 \
            SWIFT_STRICT_CONCURRENCY=complete \
            | xcpretty

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FaceSwapLiveAppV17-xcresult
          path: ${{ runner.temp }}/FaceSwapLiveAppV17.xcresult
          if-no-files-found: ignore
